name: Bootstrap Leaflet foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validated Leaflet foundation
        env:
          FOUNDATION_ARCHIVE: 
        run: |
          printf '%s' "$FOUNDATION_ARCHIVE" | base64 --decode > /tmp/leaflet-foundation.tar.gz
          echo "39fb5e04cabc38939bfb759662ebf95c989826459e06da9c9c26253839adaeb0  /tmp/leaflet-foundation.tar.gz" | sha256sum --check
          tar -xzf /tmp/leaflet-foundation.tar.gz
          rm -f .github/workflows/bootstrap-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: establish Leaflet project operating system"
          git push origin HEAD:main
